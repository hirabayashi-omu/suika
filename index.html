<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suika Game (HTML5 Port)</title>
    <link rel="icon" href="icon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <!-- Load Matter.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <div id="ui-layer">
        <!-- Title Screen -->
        <div id="title-screen" class="screen active">
            <h1>SUIKA GAME</h1>
            <button id="btn-single" class="menu-btn">1人プレイ (Single Player)</button>
            <button id="btn-vs" class="menu-btn">対戦モード (VS Mode)</button>
            
            <div id="sound-settings" style="pointer-events: auto; margin-top: 30px; font-size: 1.2rem; color: white; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; display: inline-block;">
                <h3 style="margin: 0 0 15px 0;">設定 (Settings)</h3>
                <label style="margin-right: 20px; cursor: pointer;"><input type="checkbox" id="chk-bgm" checked style="transform: scale(1.5); margin-right: 8px;"> BGM</label>
                <label style="cursor: pointer;"><input type="checkbox" id="chk-se" checked style="transform: scale(1.5); margin-right: 8px;"> 効果音 (SE)</label>
                <br>
                <label style="font-size: 1.1rem; margin-top: 15px; display: inline-block; cursor: pointer;">
                    音量 (Volume): <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="0.3" style="vertical-align: middle; margin-left: 10px;">
                </label>
                <br>
                <label style="cursor: pointer; margin-top: 15px; display: inline-block;"><input type="checkbox" id="chk-guide" checked style="transform: scale(1.5); margin-right: 8px;"> 落下ガイドライン (Guideline)</label>
            </div>
        </div>
        
        <!-- Game UI -->
        <div id="game-ui" class="screen">
            <button id="btn-back" class="small-btn">タイトルへ戻る</button>
            <div id="game-over-panel" class="hidden">
                <h2>GAME OVER</h2>
                <button id="btn-retry" class="menu-btn">リトライ (Retry)</button>
            </div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- Scripts -->
    <script src="main.js"></script>
    <script src="single.js"></script>
    <script src="vs.js"></script>
</body>
</html>
